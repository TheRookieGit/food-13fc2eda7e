<style>
  /* The look of the Mac app: a menu card. Ivory and warm ink, wine for what matters, brass for the fine print. */
  :root { --bg: #f4efe6; --surface: #fffcf6; --surface-2: rgba(35, 28, 23, .05); --text: #231c17; --muted: #7a7068; --faint: #a39a90;
    --line: rgba(35, 28, 23, .12); --paper: #fffefa; --food: #7a1e2c; --on-food: #fff8ee; --food-soft: rgba(122, 30, 44, .1);
    --brass: #9c7640; --ok: #4e7257; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --serif: ui-serif, "New York", "Songti SC", "STSong", Georgia, serif; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14120f; --surface: #1e1b17; --surface-2: rgba(241, 234, 223, .06); --text: #f1eadf; --muted: #a99f93; --faint: #7a7167;
      --line: rgba(241, 234, 223, .12); --paper: #2a2622; --food: #c0606b; --on-food: #fff4ea; --food-soft: rgba(192, 96, 107, .16);
      --brass: #d2b07a; --ok: #8db898; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--food); outline-offset: 2px; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 96px; }
  main.wide { max-width: 1100px; }
  .serif { font-family: var(--serif); }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--brass); }
  .cloche { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  header h1 { font: 600 22px/1.2 var(--serif); margin: 0; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .grow { flex: 1; min-width: 0; }
  .quiet { min-height: 40px; padding: 0 10px; border-radius: 10px; color: var(--muted); font-size: 14px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 28px; z-index: 20;
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .tabs button { min-height: 44px; padding: 0 6px; font: 15.5px var(--serif); color: var(--muted); border-bottom: 1.5px solid transparent; border-radius: 0; }
  .tabs button[aria-selected="true"] { color: var(--food); font-weight: 600; border-bottom-color: var(--food); }
  .hint { font-size: 12px; color: var(--faint); margin: 10px 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  .empty b { display: block; font: 500 17px var(--serif); color: var(--text); margin-bottom: 4px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .error { color: #b3261e; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a80; } }
  .btn { min-height: 44px; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .btn.main { background: var(--food); color: var(--on-food); }
  .btn.plain { background: transparent; border: 1px solid var(--line); }
  #notice { position: fixed; left: 16px; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; z-index: 30;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #notice.bad { background: #b3261e; color: #fff; }
  #notice[hidden] { display: none; }

  /* Login */
  .login { max-width: 360px; margin: 18vh auto 0; display: grid; gap: 12px; text-align: center; }

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" role="tablist" hidden>
  <button type="button" role="tab" data-tab="roll" aria-selected="true">抽签</button>
  <button type="button" role="tab" data-tab="lib" aria-selected="false">餐厅库</button>
</nav>
<div id="notice" role="status" hidden></div>
<script>
"use strict";
// The Edge Function of this project's Supabase (…supabase.co/functions/v1/api). Can be changed on the login screen.
const DEFAULT_API = "https://gqwrrbfypojgrdqhxhid.supabase.co/functions/v1/api";
const CUISINES = ["中餐","火锅","韩餐","日料","东南亚","美式","快餐","墨西哥","西餐","甜品饮品","其他"];
const TEMPS = ["热","冷","都有"];
const LABELS = ["全家爱吃","老公认可","老婆认证","不太行","太贵了","拉肚子"];
const PRICES = [["low","$50 以内"],["mid","$50–100"],["high","$100 以上"]];
// One character for a cuisine, set in the serif like a monogram (Theme.monogram on the Mac).
const MONO = { 中餐:"中",火锅:"锅",韩餐:"韩",日料:"和",东南亚:"南",美式:"美",快餐:"快",墨西哥:"墨",西餐:"西",甜品饮品:"甜",其他:"食" };
const LIST_TITLE = "LV 饮食";
const STATUSES = ["全部","吃过","想吃","红榜","黑榜"];
const NOTED = "有备注";
const VERDICT = { red: "红榜", black: "黑榜", mixed: "红黑榜都有" };

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
// Builds an element; strings become text nodes (never HTML), null/false children are skipped.
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else if (k === "value") n.value = v;
    else if (v === true) n.setAttribute(k, "");
    else n.setAttribute(k, String(v));
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
}
// The cloche of the app icon, in fine lines.
function cloche() {
  const t = document.createElement("template");
  t.innerHTML = '<svg class="cloche" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">'
    + '<path d="M3.2 11.8C3.2 8.4 5.8 5.8 9 5.8s5.8 2.6 5.8 6"/><path d="M1.8 12.8h14.4"/><circle cx="9" cy="4.6" r="1.1" fill="currentColor" stroke="none"/></svg>';
  return t.content.firstChild;
}
const usd = (a) => "$" + Number(a).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function relTime(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
}
let noticeTimer = null;
function notice(text, bad = false) {
  const n = $("notice"); n.textContent = text; n.className = bad ? "bad" : ""; n.hidden = false;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => { n.hidden = true; }, 4200);
}

// ---- The cloud ----
const api = () => (store.get("api") || DEFAULT_API).trim();
class Unauthorized extends Error {}
async function call(body) {
  let res;
  try {
    res = await fetch(api(), { method: "POST", headers: { "content-type": "application/json", "x-passcode": store.get("passcode") || "" }, body: JSON.stringify(body) });
  } catch { throw new Error("连不上云端，请检查网络"); }
  let json = {};
  try { json = await res.json(); } catch {}
  if (res.status === 401) throw new Unauthorized(json.error || "口令不对");
  if (!res.ok) throw new Error(json.error || "服务器出错了");
  return json;
}

// ---- State ----
let base = null, pending = [], at = null, loadError = null, loading = null;
let cat = null;
// "wish" was the 想吃 tab, now inside 餐厅库.
let tab = ["lib", "wish"].includes(store.get("tab")) ? "lib" : "roll";
let pick = null, rolling = false, showVisits = false, openVisit = null, fresh = false, editing = false, saving = false;
let wishEditing = null, wishPick = null, showDoneWishes = false;
// 餐厅库: search, status, filters and the column it is sorted by (newest visit first); the place open in it.
const L = { q: "", status: "全部", area: null, cuisines: new Set(), tags: new Set(), prices: new Set(), sort: "last", desc: true, filters: false };
let libOpen = null;
const saved = (() => { try { return JSON.parse(store.get("food") || "{}"); } catch { return {}; } })();
// area: undefined = where you ate last, null = anywhere.
const F = { area: saved.area, cuisines: new Set(saved.cuisines || []), temp: saved.temp ?? null, prices: new Set(saved.prices || []) };
const saveFilters = () => store.set("food", JSON.stringify({ area: F.area, cuisines: [...F.cuisines], temp: F.temp, prices: [...F.prices] }));

// What a visit usually costs: the median of the visits with an amount. Mirrors FoodCatalog.Place.typical.
function typical(p) {
  const paid = p.visits.map(v => v.amount).filter(a => a > 0).sort((a, b) => a - b);
  if (!paid.length) return null;
  const mid = paid.length >> 1;
  return paid.length % 2 ? paid[mid] : (paid[mid - 1] + paid[mid]) / 2;
}
const bracket = (a) => a < 50 ? "low" : a <= 100 ? "mid" : "high";

// Changes the Mac has not taken in yet, applied on top of its catalog as it would (see FoodRoll.catalog / WishEdit).
function withPending(c, edits) {
  if (!c) return c;
  const out = { ...c, places: c.places, wishes: [...(c.wishes || [])] };
  const placeEdits = edits.filter(e => !e.wish), wishEdits = edits.filter(e => e.wish);
  if (placeEdits.length) {
    const byId = new Map(), places = [], edited = [];
    for (const original of c.places) {
      let p = { ...original, visits: [...original.visits], sources: [...(original.sources || [])], labels: original.labels ? [...original.labels] : undefined };
      for (const e of placeEdits) {
        if (!e.sources?.some(x => p.sources.includes(x))) continue;
        if (e.hidden) { p = null; break; }
        for (const k of ["name","area","cuisine","temp"]) if (e[k]) p[k] = e[k];
        if (typeof e.note === "string") p.note = e.note || undefined;
        if (Array.isArray(e.labels)) p.labels = e.labels.length ? LABELS.filter(l => e.labels.includes(l)) : undefined;
      }
      if (p) edited.push(p);
    }
    // A place merged into another takes the other's verdict and note when both have one: the target goes first.
    const moved = (p) => (p.name + "|" + p.area).toLowerCase() !== p.id;
    for (const p of [...edited.filter(p => !moved(p)), ...edited.filter(moved)]) {
      const id = (p.name + "|" + p.area).toLowerCase(), same = byId.get(id);
      if (!same) { p.id = id; byId.set(id, p); places.push(p); continue; }
      const days = new Map(same.visits.map(v => [v.date, { ...v }]));
      for (const v of p.visits) {
        const d = days.get(v.date);
        if (d) { d.amount += v.amount; d.receipts = [...d.receipts, ...v.receipts]; d.sources = [...new Set([...d.sources, ...v.sources])]; d.events = [...d.events, ...v.events]; }
        else days.set(v.date, { ...v });
      }
      same.visits = [...days.values()].sort((a, b) => b.date.localeCompare(a.date));
      same.sources = [...same.sources, ...p.sources].sort();
      same.verdict ??= p.verdict; same.comment ??= p.comment; same.listName ??= p.listName; same.note ??= p.note;
      if (p.labels) same.labels = LABELS.filter(l => (same.labels || []).includes(l) || p.labels.includes(l));
    }
    out.places = places.sort((a, b) => b.visits.length - a.visits.length || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  }
  wishEdits.forEach((e, n) => {
    const w = e.wish;
    if (!w.id) { out.wishes.unshift({ id: "pending-" + n, title: w.title, note: w.note || "", cuisine: w.cuisine || "", address: w.address || "", rating: w.rating || 0, createdAt: new Date().toISOString(), done: false, pending: true }); return; }
    const i = out.wishes.findIndex(x => x.id === w.id);
    if (i < 0) return;

  nodes.push(el("div", { class: "ltools" },
    el("label", { class: "search" }, glass.content.firstChild, search),
    el("button", { type: "button", class: "btn main", id: "wishAdd", onclick: () => { wishEditing = {}; draw(); window.scrollTo?.(0, 0); } }, "＋ 想吃")));
  const filterCount = (L.area ? 1 : 0) + L.cuisines.size + L.tags.size + L.prices.size;
  nodes.push(el("div", { class: "lstatus" },
    STATUSES.map(st => fchip(st, L.status === st, () => { L.status = st; draw(); })),
    el("button", { type: "button", class: "fbtn" + (filterCount || L.filters ? " on" : ""), id: "libFilters", "aria-expanded": String(L.filters),
      onclick: () => { L.filters = !L.filters; draw(); } }, filterCount ? `筛选 ${filterCount}` : "筛选")));
  if (L.filters) {
    const toggle = (set, v) => () => { set.has(v) ? set.delete(v) : set.add(v); draw(); };
    const city = el("select", { id: "libArea", "aria-label": "城市", onchange: (e) => { L.area = e.target.value || null; draw(); } },
      el("option", { value: "" }, "所有城市"), areas(cat).map(a => el("option", { value: a, selected: a === L.area }, a)));
    nodes.push(el("div", { class: "lfilters", id: "libFilterBox" },
      frow("城市", [city]),
      frow("菜系", CUISINES.map(c => fchip(c, L.cuisines.has(c), toggle(L.cuisines, c)))),
      frow("标签", [...LABELS, NOTED].map(t => fchip(t, L.tags.has(t), toggle(L.tags, t)))),
      frow("每次花费", [...PRICES.map(([k, t]) => fchip(t, L.prices.has(k), toggle(L.prices, k))),
        filterCount ? el("button", { type: "button", class: "more", style: "color:var(--food);min-height:34px;padding:0 8px", onclick: () => {
          L.area = null; L.cuisines.clear(); L.tags.clear(); L.prices.clear(); draw(); } }, "清除筛选") : null])));
  }
  if (wishEditing) nodes.push(wishForm(wishEditing));
  const open = (cat?.wishes || []).filter(w => !w.done && !w.place);
  if (L.status === "想吃" && wishPick && open.some(w => w.id === wishPick.id)) {
    nodes.push(el("div", { class: "wpick", id: "wishPick" }, el("div", { class: "eyebrow" }, "就去这家"), el("div", { class: "nm" }, wishPick.title),
      wishPick.address ? el("div", { class: "wf" }, wishPick.address) : null, wishPick.note ? el("div", { class: "wishnote" }, wishPick.note) : null));
  }
  nodes.push(el("div", { class: "lfoot" }, el("span", { id: "libCount" }, `共 ${rows.length} 家`),
    L.status === "想吃" && open.length > 1 ? el("button", { type: "button", class: "more", id: "wishRoll", style: "color:var(--food);font-weight:500;min-height:36px",
      onclick: () => { const others = open.filter(w => w.id !== wishPick?.id); wishPick = others[Math.floor(Math.random() * others.length)]; draw(); } }, "从想吃里抽一家") : null,
    L.status === "想吃" ? el("label", {}, el("input", { type: "checkbox", id: "wishShowDone", checked: showDoneWishes, onchange: (e) => { showDoneWishes = e.target.checked; draw(); } }), "含已实现的") : null));
  if (!rows.length) {
    nodes.push(el("div", { class: "empty" }, el("b", {}, cat?.places?.length || cat?.wishes?.length ? "没有符合条件的店" : "还没有店"),
      L.status === "想吃" && !(cat?.wishes || []).length ? "点「＋ 想吃」加一家，或者在「我的心愿单」的「餐厅」里记下。" : "换个关键词，或者放宽一点筛选"));
    return nodes;
  }
  const cell = (r, k) => {
    const v = r[k];
    if (k === "visits") return el("td", { class: "num" }, v > 0 ? String(v) : "");
    if (k === "typical" || k === "total") return el("td", { class: "num" }, v >= 0 ? usd(v) : "");
    if (k === "verdict") return el("td", { class: v }, v ? { red: "红榜", black: "黑榜", mixed: "红黑榜" }[v] : "");
    if (k === "want") return el("td", { class: v === "想吃" ? "want" : "" }, v);
    if (["note", "comment", "dishes"].includes(k)) return el("td", { class: "long", title: v || null }, v);
    return el("td", {}, v);
  };
  const head = el("tr", {}, COLUMNS.map(([k, t]) => el("th", { "aria-sort": L.sort === k ? (L.desc ? "descending" : "ascending") : "none" },
    el("button", { type: "button", "data-sort": k, onclick: () => { if (L.sort === k) L.desc = !L.desc; else { L.sort = k; L.desc = ["visits", "last", "typical", "total"].includes(k); } draw(); } },
      t, L.sort === k ? el("span", {}, L.desc ? "▼" : "▲") : null))));
  const body = el("tbody", {}, rows.map(r => el("tr", { "data-id": r.id, onclick: () => {
    if (r.wishOnly) { wishEditing = { ...r.wishOnly }; draw(); window.scrollTo?.(0, 0); }
    else { libOpen = r.place; editing = false; showVisits = true; openVisit = null; draw(); window.scrollTo?.(0, 0); }
  } }, COLUMNS.map(([k]) => cell(r, k)))));
  nodes.push(el("div", { class: "sheet", id: "sheet" }, el("table", {}, el("thead", {}, head), body)));
  return nodes;
}

// One place from 餐厅库: its card, corrections and visits, and a way back to the table.
function placeScreen(p) {
  return [
    el("button", { type: "button", class: "back", id: "libBack", onclick: () => { libOpen = null; editing = false; draw(); } }, "‹ 餐厅库"),
    el("div", { class: "stage", id: "stage" }, pickCard(p)),
    editing ? editForm(p) : null,
    showVisits && p.visits.length ? visitList(p) : null,
  ];
}

function wishForm(w) {
  const title = el("input", { type: "text", id: "wTitle", value: w.title || "", "aria-label": "店名", placeholder: "比如 Gen Korean BBQ", autocomplete: "off" });
  const cuisine = el("input", { type: "text", id: "wCuisine", value: w.cuisine || "", list: "wCuisines", "aria-label": "菜系", autocomplete: "off" });
  const cuisines = el("datalist", { id: "wCuisines" }, CUISINES.map(c => el("option", { value: c })));
  const address = el("input", { type: "text", id: "wAddress", value: w.address || "", "aria-label": "地址", placeholder: "城市或地址", autocomplete: "off" });
  const note = el("textarea", { id: "wNote", "aria-label": "备注", maxlength: 1000, placeholder: "谁推荐的、想点什么…" });
  note.value = w.note || "";
  let rating = w.rating || 0;
  const stars = el("div", { class: "rate", id: "wRate" });
  const drawStars = () => stars.replaceChildren(...[1, 2, 3, 4, 5].map(n => el("button", { type: "button", "aria-label": `${n} 星`, "aria-pressed": String(n <= rating), onclick: () => { rating = rating === n ? 0 : n; drawStars(); } }, n <= rating ? "★" : "☆")));
  drawStars();
  const save = async () => {
    const t = title.value.trim();
    if (!t) { title.focus(); return; }
    const patch = { title: t, cuisine: cuisine.value.trim(), address: address.value.trim(), note: note.value.trim(), rating };
    if (w.id) {
      patch.id = w.id;
      for (const k of ["title","cuisine","address","note","rating"]) if (patch[k] === (w[k] ?? (k === "rating" ? 0 : ""))) delete patch[k];
      if (Object.keys(patch).length === 1) { wishEditing = null; draw(); return; }
    }
    wishEditing = null;
    await send({ wish: patch });
  };
  return el("div", { class: "fedit", id: "wishForm" },
    el("h3", {}, w.id ? "修改想吃的店" : "加一家想吃的"),
    el("label", {}, "店名", title), el("label", {}, "菜系", cuisine), cuisines, el("label", {}, "地址", address), el("label", {}, "备注", note),
    el("label", {}, "等级", stars),
    el("div", { class: "row" },
      w.id ? el("button", { type: "button", class: "btn plain", id: "wDone", onclick: () => { wishEditing = null; send({ wish: { id: w.id, done: !w.done } }); } }, w.done ? "标回想吃" : "标记已实现") : null,
      w.id ? el("button", { type: "button", class: "btn plain error", id: "wDelete", onclick: () => { if (confirm(`删掉「${w.title}」吗？「我的心愿单」里也会删掉。`)) { wishEditing = null; send({ wish: { id: w.id, deleted: true } }); } } }, "删除") : null,
      el("button", { type: "button", class: "btn plain", onclick: () => { wishEditing = null; draw(); } }, "取消"),
      el("button", { type: "button", class: "btn main", id: "wSave", onclick: save }, "保存")));
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.dataset.tab; store.set("tab", tab); if (tab === "lib") libOpen = null; draw();
});

if (store.get("passcode") && api()) start(); else login();
</script>
</body>
