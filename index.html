<style>
  /* The look of the Mac app: a menu card. Ivory and warm ink, wine for what matters, brass for the fine print. */
  :root { --bg: #f4efe6; --surface: #fffcf6; --surface-2: rgba(35, 28, 23, .05); --text: #231c17; --muted: #7a7068; --faint: #a39a90;
    --line: rgba(35, 28, 23, .12); --paper: #fffefa; --food: #7a1e2c; --on-food: #fff8ee; --food-soft: rgba(122, 30, 44, .1);
    --brass: #9c7640; --ok: #4e7257; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --serif: ui-serif, "New York", "Songti SC", "STSong", Georgia, serif; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14120f; --surface: #1e1b17; --surface-2: rgba(241, 234, 223, .06); --text: #f1eadf; --muted: #a99f93; --faint: #7a7167;
      --line: rgba(241, 234, 223, .12); --paper: #2a2622; --food: #c0606b; --on-food: #fff4ea; --food-soft: rgba(192, 96, 107, .16);
      --brass: #d2b07a; --ok: #8db898; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--food); outline-offset: 2px; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 96px; }
  main.wide { max-width: 1100px; }
  .serif { font-family: var(--serif); }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--brass); }
  .cloche { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  header h1 { font: 600 22px/1.2 var(--serif); margin: 0; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .grow { flex: 1; min-width: 0; }
  .quiet { min-height: 40px; padding: 0 10px; border-radius: 10px; color: var(--muted); font-size: 14px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 28px; z-index: 20;
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .tabs button { min-height: 44px; padding: 0 6px; font: 15.5px var(--serif); color: var(--muted); border-bottom: 1.5px solid transparent; border-radius: 0; }
  .tabs button[aria-selected="true"] { color: var(--food); font-weight: 600; border-bottom-color: var(--food); }
  .hint { font-size: 12px; color: var(--faint); margin: 10px 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  .empty b { display: block; font: 500 17px var(--serif); color: var(--text); margin-bottom: 4px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .error { color: #b3261e; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a80; } }
  .btn { min-height: 44px; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .btn.main { background: var(--food); color: var(--on-food); }
  .btn.plain { background: transparent; border: 1px solid var(--line); }
  #notice { position: fixed; left: 16px; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; z-index: 30;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #notice.bad { background: #b3261e; color: #fff; }
  #notice[hidden] { display: none; }

  /* Login */
  .login { max-width: 360px; margin: 18vh auto 0; display: grid; gap: 12px; text-align: center; }
  .login .cloche { width: 56px; height: 56px; color: var(--brass); margin: 0 auto; }
  .login h1 { margin: 0; font: 600 26px var(--serif); }
  .login input { font: inherit; font-size: 16px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 14px; width: 100%; }

  /* Filters */
  .frow { display: grid; grid-template-columns: 64px 1fr; align-items: baseline; gap: 10px; margin: 0 0 10px; }
  .frow > small { font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--brass); }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fchip { min-height: 34px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; color: color-mix(in srgb, var(--text) 80%, transparent);
    transition: background .15s, color .15s, transform .15s; }
  .fchip.on { background: var(--food); border-color: var(--food); color: var(--on-food); font-weight: 500; }
  .fchip:active { transform: scale(.95); }

  /* The roll */
  .stage { position: relative; min-height: 270px; border-radius: 20px; overflow: hidden; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.05); margin: 8px 0 14px; }
  .stage::after { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--brass) 22%, transparent); border-radius: 15px; pointer-events: none; }
  .stage .idle { text-align: center; color: var(--muted); font-size: 13px; }
  .stage .idle .cloche { width: 60px; height: 60px; color: var(--brass); animation: bob 3.2s ease-in-out infinite; }
  .stage .idle b { display: block; font: 500 19px var(--serif); color: var(--text); margin: 10px 0 2px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .scard { position: absolute; left: 50%; top: 50%; width: 100px; height: 140px; margin: -70px 0 0 -50px; border-radius: 10px;
    background: var(--paper); box-shadow: 0 4px 14px rgba(0, 0, 0, .14); display: grid; place-content: center; gap: 8px; text-align: center;
    transition: transform .22s cubic-bezier(.3, 1.6, .5, 1); }
  .scard::before { content: ""; position: absolute; inset: 7px; border: 1px solid color-mix(in srgb, var(--brass) 50%, transparent); border-radius: 6px; }
  .scard .mono { font: 500 38px/1 var(--serif); color: var(--food); }
  .pick-card { text-align: center; padding: 24px 18px; width: 100%; position: relative; z-index: 1; }
  .pick-card.fresh { animation: pop .55s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ruled { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .ruled::before, .ruled::after { content: ""; width: 22px; border-top: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); }
  .pick-card .nm { font: 600 27px/1.2 var(--serif); margin: 6px 0 4px; overflow-wrap: anywhere; }
  .pick-card .tg { font-size: 12.5px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 0 4px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats > div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font: 500 17px var(--serif); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .stats small { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .pick-card .st { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
  .pick-card .dishes { font: 13.5px/1.6 var(--serif); margin: 10px 6px 0; overflow-wrap: anywhere; }
  .pick-card .dishes .eyebrow { display: block; font-family: -apple-system, sans-serif; margin-bottom: 2px; }
  .pick-card .dishes.none { font: 12px -apple-system, sans-serif; color: var(--faint); }
  .labels { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .lchip { min-height: 30px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); color: var(--muted); }
  .lchip.on { color: var(--on-food); font-weight: 500; border-color: transparent; }
  .lchip.on[data-l="全家爱吃"] { background: var(--food); } .lchip.on[data-l="老公认可"] { background: #9a3b4f; } .lchip.on[data-l="老婆认证"] { background: #6e2f5a; }
  .lchip.on[data-l="不太行"] { background: #6b655e; } .lchip.on[data-l="太贵了"] { background: #7a5a36; } .lchip.on[data-l="拉肚子"] { background: #5c4a36; }
  .pick-card .more { color: var(--food); margin-top: 6px; font-size: 13.5px; font-weight: 500; min-height: 40px; padding: 0 6px; }
  .spark { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--brass); pointer-events: none; z-index: 2; animation: burst 1.1s ease-out both; }

</style>

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" role="tablist" hidden>
  <button type="button" role="tab" data-tab="roll" aria-selected="true">抽签</button>
  <button type="button" role="tab" data-tab="lib" aria-selected="false">餐厅库</button>
</nav>
<div id="notice" role="status" hidden></div>
<script>
"use strict";
// The Edge Function of this project's Supabase (…supabase.co/functions/v1/api). Can be changed on the login screen.
const DEFAULT_API = "https://gqwrrbfypojgrdqhxhid.supabase.co/functions/v1/api";
const CUISINES = ["中餐","火锅","韩餐","日料","东南亚","美式","快餐","墨西哥","西餐","甜品饮品","其他"];
const TEMPS = ["热","冷","都有"];
const LABELS = ["全家爱吃","老公认可","老婆认证","不太行","太贵了","拉肚子"];
const PRICES = [["low","$50 以内"],["mid","$50–100"],["high","$100 以上"]];
// One character for a cuisine, set in the serif like a monogram (Theme.monogram on the Mac).
const MONO = { 中餐:"中",火锅:"锅",韩餐:"韩",日料:"和",东南亚:"南",美式:"美",快餐:"快",墨西哥:"墨",西餐:"西",甜品饮品:"甜",其他:"食" };
const LIST_TITLE = "LV 饮食";
const STATUSES = ["全部","吃过","想吃","红榜","黑榜"];
const NOTED = "有备注";
const VERDICT = { red: "红榜", black: "黑榜", mixed: "红黑榜都有" };

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
// Builds an element; strings become text nodes (never HTML), null/false children are skipped.
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else if (k === "value") n.value = v;
    else if (v === true) n.setAttribute(k, "");
    else n.setAttribute(k, String(v));
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
}
// The cloche of the app icon, in fine lines.
function cloche() {
  const t = document.createElement("template");
  t.innerHTML = '<svg class="cloche" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">'
    + '<path d="M3.2 11.8C3.2 8.4 5.8 5.8 9 5.8s5.8 2.6 5.8 6"/><path d="M1.8 12.8h14.4"/><circle cx="9" cy="4.6" r="1.1" fill="currentColor" stroke="none"/></svg>';
  return t.content.firstChild;
}
const usd = (a) => "$" + Number(a).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function relTime(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
}
let noticeTimer = null;
function notice(text, bad = false) {
  const n = $("notice"); n.textContent = text; n.className = bad ? "bad" : ""; n.hidden = false;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => { n.hidden = true; }, 4200);
}

// ---- The cloud ----
const api = () => (store.get("api") || DEFAULT_API).trim();
class Unauthorized extends Error {}
async function call(body) {
  let res;
  try {
    res = await fetch(api(), { method: "POST", headers: { "content-type": "application/json", "x-passcode": store.get("passcode") || "" }, body: JSON.stringify(body) });
  } catch { throw new Error("连不上云端，请检查网络"); }
  let json = {};
  try { json = await res.json(); } catch {}
  if (res.status === 401) throw new Unauthorized(json.error || "口令不对");
  if (!res.ok) throw new Error(json.error || "服务器出错了");
  return json;
}

// ---- State ----
let base = null, pending = [], at = null, loadError = null, loading = null;
let cat = null;
// "wish" was the 想吃 tab, now inside 餐厅库.
let tab = ["lib", "wish"].includes(store.get("tab")) ? "lib" : "roll";
let pick = null, rolling = false, showVisits = false, openVisit = null, fresh = false, editing = false, saving = false;
let wishEditing = null, wishPick = null, showDoneWishes = false;
// 餐厅库: search, status, filters and the column it is sorted by (newest visit first); the place open in it.
const L = { q: "", status: "全部", area: null, cuisines: new Set(), tags: new Set(), prices: new Set(), sort: "last", desc: true, filters: false };
let libOpen = null;
const saved = (() => { try { return JSON.parse(store.get("food") || "{}"); } catch { return {}; } })();
// area: undefined = where you ate last, null = anywhere.
const F = { area: saved.area, cuisines: new Set(saved.cuisines || []), temp: saved.temp ?? null, prices: new Set(saved.prices || []) };
const saveFilters = () => store.set("food", JSON.stringify({ area: F.area, cuisines: [...F.cuisines], temp: F.temp, prices: [...F.prices] }));

// What a visit usually costs: the median of the visits with an amount. Mirrors FoodCatalog.Place.typical.
function typical(p) {
  const paid = p.visits.map(v => v.amount).filter(a => a > 0).sort((a, b) => a - b);
  if (!paid.length) return null;
  const mid = paid.length >> 1;
  return paid.length % 2 ? paid[mid] : (paid[mid - 1] + paid[mid]) / 2;
}
const bracket = (a) => a < 50 ? "low" : a <= 100 ? "mid" : "high";

// Changes the Mac has not taken in yet, applied on top of its catalog as it would (see FoodRoll.catalog / WishEdit).
function withPending(c, edits) {
  if (!c) return c;
  const out = { ...c, places: c.places, wishes: [...(c.wishes || [])] };
  const placeEdits = edits.filter(e => !e.wish), wishEdits = edits.filter(e => e.wish);
  if (placeEdits.length) {
    const byId = new Map(), places = [], edited = [];
    for (const original of c.places) {
      let p = { ...original, visits: [...original.visits], sources: [...(original.sources || [])], labels: original.labels ? [...original.labels] : undefined };
      for (const e of placeEdits) {
        if (!e.sources?.some(x => p.sources.includes(x))) continue;
        if (e.hidden) { p = null; break; }
        for (const k of ["name","area","cuisine","temp"]) if (e[k]) p[k] = e[k];
        if (typeof e.note === "string") p.note = e.note || undefined;
        if (Array.isArray(e.labels)) p.labels = e.labels.length ? LABELS.filter(l => e.labels.includes(l)) : undefined;
      }
      if (p) edited.push(p);
    }
    // A place merged into another takes the other's verdict and note when both have one: the target goes first.
    const moved = (p) => (p.name + "|" + p.area).toLowerCase() !== p.id;
    for (const p of [...edited.filter(p => !moved(p)), ...edited.filter(moved)]) {
      const id = (p.name + "|" + p.area).toLowerCase(), same = byId.get(id);
      if (!same) { p.id = id; byId.set(id, p); places.push(p); continue; }
      const days = new Map(same.visits.map(v => [v.date, { ...v }]));
      for (const v of p.visits) {
        const d = days.get(v.date);
        if (d) { d.amount += v.amount; d.receipts = [...d.receipts, ...v.receipts]; d.sources = [...new Set([...d.sources, ...v.sources])]; d.events = [...d.events, ...v.events]; }
        else days.set(v.date, { ...v });
      }
      same.visits = [...days.values()].sort((a, b) => b.date.localeCompare(a.date));
      same.sources = [...same.sources, ...p.sources].sort();
      same.verdict ??= p.verdict; same.comment ??= p.comment; same.listName ??= p.listName; same.note ??= p.note;
      if (p.labels) same.labels = LABELS.filter(l => (same.labels || []).includes(l) || p.labels.includes(l));
    }
    out.places = places.sort((a, b) => b.visits.length - a.visits.length || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  }
  wishEdits.forEach((e, n) => {
    const w = e.wish;
    if (!w.id) { out.wishes.unshift({ id: "pending-" + n, title: w.title, note: w.note || "", cuisine: w.cuisine || "", address: w.address || "", rating: w.rating || 0, createdAt: new Date().toISOString(), done: false, pending: true }); return; }
    const i = out.wishes.findIndex(x => x.id === w.id);
    if (i < 0) return;
    if (w.deleted) { out.wishes.splice(i, 1); return; }
    const x = { ...out.wishes[i] };
    for (const k of ["title","note","cuisine","address","rating","done"]) if (w[k] !== undefined) x[k] = w[k];
    out.wishes[i] = x;
  });
  return out;
}
const follow = (old) => old && (cat?.places.find(p => p.sources?.some(x => old.sources?.includes(x))) || null);
const refresh = () => { cat = withPending(base, pending); pick = follow(pick); libOpen = follow(libOpen); };

function areas(c) {
  const n = new Map();
  for (const p of c.places) if (p.area) n.set(p.area, (n.get(p.area) || 0) + p.visits.length);
  return [...n].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).map(x => x[0]);
}
function currentArea(c) {
  let best = null;
  for (const p of c.places) if (p.area && (!best || (p.visits[0]?.date || "") > (best.visits[0]?.date || ""))) best = p;
  return best?.area ?? null;
}
const area = () => F.area === undefined ? currentArea(cat) : F.area;
function pool() {
  if (!cat) return [];
  const a = area();
  return cat.places.filter(p => (!a || p.area === a) && (!F.cuisines.size || F.cuisines.has(p.cuisine))
    && (!F.temp || p.temp === F.temp || p.temp === "都有")
    && (!F.prices.size || (typical(p) != null && F.prices.has(bracket(typical(p))))));
}

// ---- Screens ----
function login(message) {
  $("tabs").hidden = true;
  const pass = el("input", { type: "password", id: "pass", placeholder: "口令", autocomplete: "current-password", "aria-label": "口令" });
  const addr = el("input", { type: "url", id: "addr", placeholder: "云端地址（…/functions/v1/api）", value: api(), "aria-label": "云端地址", autocomplete: "off" });
  const go = async () => {
    if (!pass.value.trim()) return;
    if (addr.value.trim()) store.set("api", addr.value.trim());
    store.set("passcode", pass.value.trim());
    try { await call({ action: "ping" }); start(); }
    catch (err) { store.set("passcode", null); login(err.message); }
  };
  pass.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("app").replaceChildren(el("div", { class: "login" },
    cloche(), el("h1", {}, "今天吃什么"),
    DEFAULT_API && !message?.includes("连不上") ? null : addr, pass,
    el("button", { type: "button", class: "btn main", id: "login", onclick: go }, "进入"),
    message ? el("p", { class: "error", id: "loginError" }, message) : null,
    el("p", { class: "hint" }, "口令只存在这台手机上。")));
  pass.focus();
}

function start() {
  $("tabs").hidden = false;
  drawTabs();
  load(true);
}

function load(force = false) {
  if (loading) return loading;
  if (cat && !force) { draw(); return Promise.resolve(); }
  $("app").replaceChildren(head(), el("div", { class: "empty", id: "loadingBox" }, "正在取吃过的店…"));
  loading = (async () => {
    try {
      const r = await call({ action: "food_get" });
      base = r.catalog || null; pending = r.pending || []; at = r.updatedAt || null; loadError = null; refresh();
    } catch (err) {
      if (err instanceof Unauthorized) { loading = null; store.set("passcode", null); login(err.message); return; }
      loadError = err;
    } finally { loading = null; }
    draw();
  })();
  return loading;
}

function head() {
  const n = cat ? cat.places.filter(p => p.visits.length).length : 0;
  return el("header", {},
    el("div", { class: "grow" }, el("h1", {}, "今天吃什么"), el("div", { class: "sub" }, cat ? `${n} 家吃过的店` : "")),
    el("button", { type: "button", class: "quiet", id: "reload", onclick: () => load(true) }, "刷新"),
    el("button", { type: "button", class: "quiet", id: "logout", onclick: () => { store.set("passcode", null); base = cat = pick = null; pending = []; login(); } }, "退出"));
}

function drawTabs() {
  for (const b of $("tabs").querySelectorAll("button")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
}

function draw() {
  drawTabs();
  const box = $("app");
  if (loadError) {
    box.replaceChildren(head(), el("div", { class: "box" }, el("p", { class: "error" }, loadError.message),
      el("button", { type: "button", class: "btn plain", onclick: () => load(true) }, "再试一次")));
    return;
  }
  box.classList.toggle("wide", tab === "lib" && !libOpen);
  box.replaceChildren(head(), ...(tab === "lib" ? libScreen() : rollScreen()).filter(Boolean),
    el("p", { class: "hint", id: "foot" }, at ? `Mac 上次整理：${relTime(at)}。` : "", "来自 MoneyWiz、小票和日历；菜系、冷热和城市由 AI 判断。"));
}

const fchip = (text, on, onclick) => el("button", { type: "button", class: "fchip" + (on ? " on" : ""), "aria-pressed": String(on), onclick }, text);
const frow = (title, chips) => el("div", { class: "frow" }, el("small", {}, title), el("div", { class: "fchips" }, chips));

function rollScreen() {
  if (!cat || !cat.places?.length) {

  const days = last ? Math.round((Date.parse(ymd(new Date()) + "T00:00:00Z") - Date.parse(last.date + "T00:00:00Z")) / 86400000) : 0;
  const usual = typical(p);

  const stats = !p.visits.length ? el("div", { class: "st" }, `还没吃过 · 在备忘录「${LIST_TITLE}」里`)
    : el("div", { class: "stats", id: "stats" }, stat(`${p.visits.length}`, "到访次数"), stat(last.date, days > 0 ? `上次 · ${days} 天前` : "上次 · 今天"),
      stat(usual != null ? usd(usual) : "—", total > 0 ? `每次 · 共 ${usd(total)}` : "通常每次"));
  const hasItems = p.visits.some(v => v.receipts.some(r => r.items?.length));
  const dishes = p.dishes ? el("div", { class: "dishes", id: "dishes" }, el("span", { class: "eyebrow" }, "吃过什么"), p.dishes)
    : p.visits.length ? el("div", { class: "dishes none", id: "dishes" }, hasItems ? "吃过什么还在整理中" : "没有小票明细，补上小票就能看到吃过什么") : null;
  const wish = (cat.wishes || []).find(w => w.place === p.id && !w.done);
  // The pop and sparkles play once, when the pick lands, not on every redraw.
  const isFresh = fresh; fresh = false;
  const card = el("div", { class: "pick-card" + (isFresh ? " fresh" : ""), id: "pick" },
    el("div", { class: "ruled eyebrow" }, p.cuisine),
    el("div", { class: "nm", id: "pickName" }, p.name),
    el("div", { class: "tg" }, [p.area, p.temp === "冷" ? "冷食" : p.temp === "热" ? "热食" : null].filter(Boolean).join("  ·  ")),
    stats,
    dishes,
    el("div", { class: "labels", id: "labels" }, LABELS.map(l => {
      const on = (p.labels || []).includes(l);
      return el("button", { type: "button", class: "lchip" + (on ? " on" : ""), "data-l": l, "aria-pressed": String(on), onclick: () => toggleLabel(p, l) }, l);
    })),
    p.verdict && el("div", {}, el("span", { class: "verdict " + p.verdict }, VERDICT[p.verdict])),
    p.verdict && p.comment && el("div", { class: "vcomment" }, (p.listName ? `「${p.listName}」` : "") + p.comment),
    wish && el("div", { class: "wishnote" }, "在想吃清单里" + (wish.note ? "：" + wish.note : "")),
    p.note && el("div", { class: "mynote", id: "myNote" }, `“${p.note}”`),
    el("div", { class: "acts" },
      p.visits.length ? el("button", { type: "button", class: "more", id: "visits", "aria-expanded": String(showVisits), onclick: () => { showVisits = !showVisits; draw(); } }, showVisits ? "收起到访记录 ▴" : "到访记录 ▾") : null,
      el("button", { type: "button", class: "more", id: "edit", "aria-expanded": String(editing), onclick: () => { editing = !editing; draw(); } }, "修改")));
  const frag = document.createDocumentFragment(); frag.append(card);
  if (isFresh && !reduced()) for (let i = 0; i < 10; i++) {
    const a = i / 10 * 2 * Math.PI;
    frag.append(el("span", { class: "spark", "aria-hidden": "true", style: `--x:${Math.round(Math.cos(a) * 160)}px;--y:${Math.round(Math.sin(a) * 105)}px` }));
  }

}
const reduced = () => !!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

async function roll() {
  const p = pool();
  if (!p.length || rolling) return;
  const previous = pick;
  rolling = true; pick = null; showVisits = false; openVisit = null; editing = false; draw();
  const stage = $("stage"), cuisines = p.slice(0, 12).map(x => x.cuisine);
  if (!reduced()) {
    const cards = [0, 1, 2].map(() => el("div", { class: "scard", "aria-hidden": "true" }));
    stage.replaceChildren(...cards);
    for (let step = 0; step < 9; step++) {
      cards.forEach((c, i) => {
        const slot = (i + step) % 3;
        const cuisine = cuisines[(i + step) % cuisines.length];
        c.replaceChildren(el("div", { class: "mono" }, MONO[cuisine] || "食"), el("div", { class: "eyebrow" }, cuisine));
        c.style.transform = `translate(${(slot - 1) * 70}px, ${slot === 1 ? -14 : 6}px) rotate(${(slot - 1) * 12}deg)`;
        c.style.zIndex = slot === 1 ? 2 : 0;
      });
      await new Promise(r => setTimeout(r, 90 + step * 18));
    }
  }
  const others = p.length > 1 ? p.filter(x => x.id !== previous?.id) : p;
  pick = others[Math.floor(Math.random() * others.length)];
  rolling = false; fresh = true; draw();
}

// A change from the phone: shown here at once (kept as pending until the Mac has taken it in), sent to the cloud.
async function send(patch, { optimistic = true } = {}) {
  if (optimistic) { pending.push(patch); refresh(); draw(); }
  try {
    const r = await call({ action: "food_edit", patch });
    if (!optimistic) { pending.push(r.patch || patch); refresh(); }
    notice(r.mac?.online ? "已改好，Mac 几秒内同步到各处。" : "已改好，这台手机上已经生效；Mac 醒来后同步到各处。");
    return true;
  } catch (err) {
    if (optimistic) { pending.splice(pending.lastIndexOf(patch), 1); refresh(); }
    if (err instanceof Unauthorized) { store.set("passcode", null); login(err.message); return false; }
    notice(err.message, true);
    return false;
  } finally { draw(); }
}

function toggleLabel(p, l) {
  const now = new Set(p.labels || []);
  now.has(l) ? now.delete(l) : now.add(l);
  send({ sources: p.sources, labels: LABELS.filter(x => now.has(x)) });
}

// Correct the pick on the spot: the Mac keeps the correction and rebuilds for everyone.
function editForm(p) {
  const name = el("input", { type: "text", id: "feName", value: p.name, "aria-label": "店名", autocomplete: "off" });
  const ar = el("input", { type: "text", id: "feArea", value: p.area, list: "feAreas", "aria-label": "城市", autocomplete: "off" });
  const list = el("datalist", { id: "feAreas" }, areas(cat).slice(0, 12).map(a => el("option", { value: a })));
  const cuisine = el("select", { id: "feCuisine", "aria-label": "菜系" }, CUISINES.map(c => el("option", { value: c, selected: c === p.cuisine }, c)));
  const temp = el("select", { id: "feTemp", "aria-label": "冷热" }, TEMPS.map(t => el("option", { value: t, selected: t === p.temp }, t)));
  const others = cat.places.filter(o => o.area === p.area && o.id !== p.id).sort((a, b) => a.name.localeCompare(b.name));
  const merge = el("select", { id: "feMerge", "aria-label": "合并到" }, el("option", { value: "" }, "不合并（是另一家店）"), others.map(o => el("option", { value: o.id }, o.name)));
  const hidden = el("input", { type: "checkbox", id: "feHidden" });
  const note = el("textarea", { id: "feNote", maxlength: 500, "aria-label": "备注", placeholder: "比如：周末人多要等位" });
  note.value = p.note || "";
  const count = el("div", { class: "count" }, `${note.value.length}/500`);
  note.addEventListener("input", () => { count.textContent = `${note.value.length}/500`; });
  const save = async () => {
    const target = others.find(o => o.id === merge.value);
    const patch = { sources: p.sources };
    const n = note.value.trim();
    if (hidden.checked) patch.hidden = true;
    else {
      if (target) Object.assign(patch, { name: target.name, area: target.area });
      else {
        if (name.value.trim() && name.value.trim() !== p.name) patch.name = name.value.trim();
        if (ar.value.trim() && ar.value.trim() !== p.area) patch.area = ar.value.trim();
        if (cuisine.value !== p.cuisine) patch.cuisine = cuisine.value;
        if (temp.value !== p.temp) patch.temp = temp.value;
      }
      if (n !== (p.note || "")) patch.note = n;
    }
    if (Object.keys(patch).length === 1) { editing = false; draw(); return; }
    saving = true; draw();
    const ok = await send(patch, { optimistic: false });
    saving = false; if (ok) editing = false; draw();
  };
  return el("div", { class: "fedit", id: "editForm" },
    el("h3", {}, "修改这家店"),
    el("label", {}, "店名", name), el("label", {}, "城市", ar), list, el("label", {}, "菜系", cuisine), el("label", {}, "冷热", temp), el("label", {}, "合并到", merge),
    el("label", {}, "备注", note), count,
    el("label", { class: "check" }, hidden, "这不是吃饭的地方，以后别再抽到"),
    el("p", { class: "hint" }, "合并后两家的记录算作同一家。改动由 Mac 记住，重新整理也不会被覆盖。清空备注就是删掉它。"),
    el("div", { class: "row" },
      el("button", { type: "button", class: "btn plain", onclick: () => { editing = false; draw(); } }, "取消"),
      el("button", { type: "button", class: "btn main", id: "feSave", disabled: saving, onclick: save }, saving ? "保存中…" : "保存")));
}

function visitList(p) {

  for (const v of p.visits) {
    const kinds = v.sources.map(s => ({ moneywiz: "刷卡", receipt: "小票", calendar: "日历" })[s]).filter(Boolean);
    if (v.receipts.length && !v.sources.includes("receipt")) kinds.push("小票");

    rows.append(el("button", { type: "button", class: "visit", disabled: !v.receipts.length, "aria-expanded": v.receipts.length ? String(open) : null,
      onclick: () => { openVisit = open ? null : v.date; draw(); } },
      el("span", { class: "vd" }, v.date), el("span", { class: "vs" }, kinds.join(" · ")), el("span", { class: "ve" }, v.events.join("、")),
      v.amount > 0 && el("span", { class: "va" }, usd(v.amount)), v.receipts.length ? el("span", { class: "vc" }, open ? "▴" : "▾") : null));

function slip(r) {

async function original(path) {
  try {
    const r = await call({ action: "views", paths: [path] });
    const url = r.urls?.[path];
    if (!url) { notice("云端还没有这张小票的图片，Mac 同步后再看", true); return; }
    const box = el("div", { class: "lightbox", role: "dialog", "aria-label": "小票原件", onclick: () => box.remove() }, el("img", { src: url, alt: "小票原件" }));
    document.body.append(box);
  } catch (err) { notice(err.message, true); }
}

// Every place and every wish not matched to one, as rows of plain values (Library.Row on the Mac).
function libRows() {
  const wishes = cat?.wishes || [], wishFor = new Map();
  for (const w of wishes) if (!w.done && w.place && !wishFor.has(w.place)) wishFor.set(w.place, w);
  const rows = (cat?.places || []).map(p => {
    const w = wishFor.get(p.id), total = p.visits.reduce((s, v) => s + v.amount, 0);
    return { id: "p:" + p.id, place: p, wish: w, name: p.name, cuisine: p.cuisine, area: p.area, visits: p.visits.length, last: p.visits[0]?.date || "",
      typical: typical(p) ?? -1, total: total > 0 ? total : -1, verdict: p.verdict || "", want: w ? "想吃" : "", labels: (p.labels || []).join("、"),
      note: p.note || "", comment: p.comment || "", dishes: p.dishes || "",
      tags: new Set([...(p.labels || []), ...(p.note || p.comment ? [NOTED] : [])]),
      text: [p.name, p.area, p.cuisine, p.note, p.comment, p.listName, p.dishes, w?.note, (p.labels || []).join(" ")].filter(Boolean).join("\n").toLowerCase() };
  });
  for (const w of wishes) {
    if (w.place || (w.done && !showDoneWishes)) continue;
    rows.push({ id: "w:" + w.id, wishOnly: w, name: w.title, cuisine: CUISINES.find(c => (w.cuisine || "").includes(c)) || "其他", area: w.address || "",
      visits: 0, last: "", typical: -1, total: -1, verdict: "", want: w.done ? "已实现" : "想吃", labels: "", note: w.note || "", comment: "", dishes: "",
      tags: new Set(w.note ? [NOTED] : []), text: [w.title, w.cuisine, w.address, w.note].filter(Boolean).join("\n").toLowerCase() });
  }
  const words = L.q.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = rows.filter(r => {
    const p = r.place;
    const status = L.status === "全部" || (L.status === "吃过" ? r.visits > 0 : L.status === "想吃" ? !!r.want
      : L.status === "红榜" ? ["red", "mixed"].includes(r.verdict) : ["black", "mixed"].includes(r.verdict));
    return status && (!L.area || (p ? p.area === L.area : r.area.toLowerCase().includes(L.area.toLowerCase())))
      && (!L.cuisines.size || L.cuisines.has(r.cuisine)) && (!L.tags.size || [...L.tags].some(t => r.tags.has(t)))
      && (!L.prices.size || (r.typical >= 0 && L.prices.has(bracket(r.typical)))) && words.every(w => r.text.includes(w));
  });
  const k = L.sort, dir = L.desc ? -1 : 1;
  return shown.sort((a, b) => {
    const x = a[k], y = b[k];
    const c = typeof x === "number" ? x - y : x.localeCompare(y, "zh-Hans-CN");
    return c ? c * dir : a.name.localeCompare(b.name, "zh-Hans-CN");
  });
}

    else { libOpen = r.place; editing = false; showVisits = true; openVisit = null; draw(); window.scrollTo?.(0, 0); }
  } }, COLUMNS.map(([k]) => cell(r, k)))));
  nodes.push(el("div", { class: "sheet", id: "sheet" }, el("table", {}, el("thead", {}, head), body)));
  return nodes;
}

// One place from 餐厅库: its card, corrections and visits, and a way back to the table.
function placeScreen(p) {
  return [
    el("button", { type: "button", class: "back", id: "libBack", onclick: () => { libOpen = null; editing = false; draw(); } }, "‹ 餐厅库"),
    el("div", { class: "stage", id: "stage" }, pickCard(p)),
    editing ? editForm(p) : null,
    showVisits && p.visits.length ? visitList(p) : null,
  ];
}

function wishForm(w) {
  const title = el("input", { type: "text", id: "wTitle", value: w.title || "", "aria-label": "店名", placeholder: "比如 Gen Korean BBQ", autocomplete: "off" });
  const cuisine = el("input", { type: "text", id: "wCuisine", value: w.cuisine || "", list: "wCuisines", "aria-label": "菜系", autocomplete: "off" });
  const cuisines = el("datalist", { id: "wCuisines" }, CUISINES.map(c => el("option", { value: c })));
  const address = el("input", { type: "text", id: "wAddress", value: w.address || "", "aria-label": "地址", placeholder: "城市或地址", autocomplete: "off" });
  const note = el("textarea", { id: "wNote", "aria-label": "备注", maxlength: 1000, placeholder: "谁推荐的、想点什么…" });
  note.value = w.note || "";
  let rating = w.rating || 0;
  const stars = el("div", { class: "rate", id: "wRate" });
  const drawStars = () => stars.replaceChildren(...[1, 2, 3, 4, 5].map(n => el("button", { type: "button", "aria-label": `${n} 星`, "aria-pressed": String(n <= rating), onclick: () => { rating = rating === n ? 0 : n; drawStars(); } }, n <= rating ? "★" : "☆")));
  drawStars();
  const save = async () => {
    const t = title.value.trim();
    if (!t) { title.focus(); return; }
    const patch = { title: t, cuisine: cuisine.value.trim(), address: address.value.trim(), note: note.value.trim(), rating };
    if (w.id) {
      patch.id = w.id;
      for (const k of ["title","cuisine","address","note","rating"]) if (patch[k] === (w[k] ?? (k === "rating" ? 0 : ""))) delete patch[k];
      if (Object.keys(patch).length === 1) { wishEditing = null; draw(); return; }
    }
    wishEditing = null;
    await send({ wish: patch });
  };
  return el("div", { class: "fedit", id: "wishForm" },
    el("h3", {}, w.id ? "修改想吃的店" : "加一家想吃的"),
    el("label", {}, "店名", title), el("label", {}, "菜系", cuisine), cuisines, el("label", {}, "地址", address), el("label", {}, "备注", note),
    el("label", {}, "等级", stars),
    el("div", { class: "row" },
      w.id ? el("button", { type: "button", class: "btn plain", id: "wDone", onclick: () => { wishEditing = null; send({ wish: { id: w.id, done: !w.done } }); } }, w.done ? "标回想吃" : "标记已实现") : null,
      w.id ? el("button", { type: "button", class: "btn plain error", id: "wDelete", onclick: () => { if (confirm(`删掉「${w.title}」吗？「我的心愿单」里也会删掉。`)) { wishEditing = null; send({ wish: { id: w.id, deleted: true } }); } } }, "删除") : null,
      el("button", { type: "button", class: "btn plain", onclick: () => { wishEditing = null; draw(); } }, "取消"),
      el("button", { type: "button", class: "btn main", id: "wSave", onclick: save }, "保存")));
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.dataset.tab; store.set("tab", tab); if (tab === "lib") libOpen = null; draw();
});

if (store.get("passcode") && api()) start(); else login();
</script>
</body>
